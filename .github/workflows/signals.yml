name: gold-signals
on:
  schedule:
    # 5 min after each M15 candle close, Mon-Fri UTC (GitHub cron can lag
    # a few minutes - that's normal)
    - cron: "5,20,35,50 * * *1-5"
  workflow_dispatch: {}   # manual "Run" button for testing

permissions:
  contents: write        # to commit state.json back

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: check for signals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python gold_signals.py

      - name: save state
        run: |
          git config user.name "signal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || git commit -m "state update [skip ci]"
          git push
